<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="main-title">图片转换icon图标</h1>
                <div class="header-link">
                    <a href="https://www.openai2025.com" target="_blank">传道软件工具箱</a>

        <main class="main-content">
            <form id="form" class="converter-form">
                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label">选择图片文件</label>
                        <div class="file-input-wrapper">
                            <input id="imageInput" type="file" name='file' accept="image/jpeg,image/gif,image/png,image/bmp,image/webp" class="file-input">
                            <div class="file-input-display">
                                <span class="file-text">点击选择图片文件</span>

                            </div>
                        </div>
                    </div>
                    
                    <div id="imageContainer" class="image-preview"></div>

                <div class="form-section">
                    <label class="form-label">图标尺寸</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="16" checked>
                            <span class="checkbox-text">16×16</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="32">

                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="48">
                            <span class="checkbox-text">48×48</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="96" checked>
                            <span class="checkbox-text">96×96</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="128">
                            <span class="checkbox-text">128×128</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="256" checked>
                            <span class="checkbox-text">256×256</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="512">
                            <span class="checkbox-text">512×512</span>
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">图标形状</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="shape" value="square" checked>
                            <span class="radio-text">正方形</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="shape" value="circle">
                            <span class="radio-text">圆形</span>

                <div class="form-section">
                    <label class="checkbox-item">
                        <input type="checkbox" name="bleed" value="bleed" checked>
                        <span class="checkbox-text">启用留白（仅在圆角矩形时生效）</span>
                    </label>

                <div class="form-actions">
                    <button id="b" type="submit" class="convert-btn">

<script type="module">
    import { img2ico } from './imageToIcon.js'
    const f = document.querySelector('#form')
    const btn = f.querySelector('#b')

    f.addEventListener('submit', (e) => {
        e.preventDefault()
        check()
    })

    function check() {
        if (f.file.files.length === 0 && f.url.value === '') {
            throw new Error('File is undefined')
        }

        convert()
    }

    async function convert() {
        let source
        if (f.file.files.length > 0) {
            source = f.file.files[0]
        } else {
            source = f.url.value
        }

        let size = []
        for (const i of f.size) {
            if (i.checked) {
                size.push(parseInt(i.value))
            }
        }

        let shape = f.shape.value
        let bleed = f.bleed.checked

        const arg = {
            source,
            size,
            shape,
            bleed,
        }
        const blob = await img2ico.convert(arg)

        download(blob)
    }

    function download(blob) {
        const a = document.createElement('a')
        a.download = new Date().getTime() + '.ico'
        a.href = URL.createObjectURL(blob)
        a.click()
    }


    function showImg() {
        const imageInput = document.getElementById('imageInput');
        const imageContainer = document.getElementById('imageContainer');
        const fileText = document.querySelector('.file-text');
        const fileIcon = document.querySelector('.file-icon');

        imageInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                // 更新文件显示
                fileText.textContent = file.name;
                fileIcon.textContent = '✓';
                
                // 清空之前的预览
                imageContainer.innerHTML = '';
                
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-image';
                    imageContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
    }
    showImg();
</script>
