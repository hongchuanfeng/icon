<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="Online free image conversion icon tool, online icon tool, image conversion icon online conversion, icon conversion, icon, conversion, image processing">
    <meta name="description" content="Online free image conversion icon tool, icon conversion, no need to log in, no need to pay, just leave after use, very convenient to use">
    <link rel="stylesheet" href="./css.css">
    <link href="bootstrap.min.css" rel="stylesheet" />

            crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="main-title">Image to Icon Converter</h1>
                <div class="header-link">
                    <a href="https://www.openai2025.com" target="_blank">Chuandao Software Toolbox</a>
                </div>
            </div>
        </header>

  
        <main class="main-content">
            <form id="form" class="converter-form">
                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label">Select Image File</label>
                        <div class="file-input-wrapper">
                            <input id="imageInput" type="file" name='file' accept="image/jpeg,image/gif,image/png,image/bmp,image/webp" class="file-input">
                            <div class="file-input-display">
                                <span class="file-text">Click to select image file</span>
                                <span class="file-icon">📁</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="imageContainer" class="image-preview"></div>
                </div>

                <div class="form-section">
                    <label class="form-label">Icon Size</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="16" checked>
                            <span class="checkbox-text">16×16</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="32">
                            <span class="checkbox-text">32×32</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="48">
                            <span class="checkbox-text">48×48</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="96" checked>
                            <span class="checkbox-text">96×96</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="128">
                            <span class="checkbox-text">128×128</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="256" checked>
                            <span class="checkbox-text">256×256</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="size" value="512">
                            <span class="checkbox-text">512×512</span>
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">Icon Shape</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="shape" value="square" checked>
                            <span class="radio-text">Square</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="shape" value="circle">
                            <span class="radio-text">Circle</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="shape" value="fillet">
                            <span class="radio-text">Rounded Square</span>
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <label class="checkbox-item">
                        <input type="checkbox" name="bleed" value="bleed" checked>
                        <span class="checkbox-text">Enable padding (only works with rounded square shape)</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button id="b" type="submit" class="convert-btn">
                        <span class="btn-text">Start Converting</span>
                        <span class="btn-icon">⚡</span>
                    </button>
                </div>
            </form>
        </main>

        <footer class="footer">
            <div class="language-switcher">
                <a href="./index.html" class="lang-link">简体中文</a>
                <span class="separator">|</span>
                <a href="./index-en.html" class="lang-link active">English</a>
            </div>
        </footer>
    </div>

</body>

<script type="module">
  import {img2ico} from './imageToIcon.js'
  const f = document.querySelector('#form')
  const btn = f.querySelector('#b')

  f.addEventListener('submit',(e)=>{
    e.preventDefault()
    check()
  })

  function check(){
    if(f.file.files.length ===0 && f.url.value===''){
      throw new Error('File is undefined')
    }
    
    convert()
  }

  async function convert(){
    let source
    if(f.file.files.length>0){
      source= f.file.files[0]
    }else{
      source=f.url.value
    }

    let size = []
    for (const i of f.size) {
      if(i.checked){
        size.push(parseInt(i.value))
      }
    }

    let shape = f.shape.value
    let bleed = f.bleed.checked

    const arg = {
      source,
      size,
      shape,
      bleed,
    }
    const blob = await img2ico.convert(arg)

    download(blob)
  }

  function download(blob){
    const a = document.createElement('a')
    a.download = new Date().getTime() + '.ico'
    a.href= URL.createObjectURL(blob)
    a.click()
  }

    function showImg() {
        const imageInput = document.getElementById('imageInput');
        const imageContainer = document.getElementById('imageContainer');
        const fileText = document.querySelector('.file-text');
        const fileIcon = document.querySelector('.file-icon');

        imageInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                // Update file display
                fileText.textContent = file.name;
                fileIcon.textContent = '✓';
                
                // Clear previous preview
                imageContainer.innerHTML = '';
                
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-image';
                    imageContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
    }
    showImg();

</script>

</html>
